name: Polish builder copy once

on:
  push:
    branches:
      - feat/osamosam-ui-v2
    paths:
      - .github/workflows/polish-builder-copy.yml

permissions:
  contents: write

jobs:
  polish-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/osamosam-ui-v2

      - name: Replace technical customer-facing copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/builder/builder-studio.tsx")
          content = path.read_text(encoding="utf-8")

          replacements = {
              'aria-label="빌더 단계"': 'aria-label="초대장 작성 단계"',
              '<p className="builder-step-kicker">빌더 진행</p>': '<p className="builder-step-kicker">초대장 완성까지</p>',
              '<h3>{`STEP ${currentStepMeta.index + 1}. ${currentStepMeta.title}`}</h3>': '<h3>{`${currentStepMeta.index + 1}번째 · ${currentStepMeta.title}`}</h3>',
              '모바일 앱과 같은 5단계 흐름으로 나눠서 작성할 수 있습니다.': '지금 필요한 내용부터 적어보세요. 언제든 앞 단계로 돌아가 고칠 수 있어요.',
              '선택 템플릿': '선택한 디자인',
              '발행 후 템플릿을 바꾸면 재결제가 필요합니다. 텍스트와 연락처 수정은 무료로 유지됩니다.': '공개한 뒤 디자인이나 대표 사진을 바꾸면 추가 비용이 생길 수 있어요. 이름과 연락처는 무료로 고칠 수 있습니다.',
              '행사 카테고리': '행사 종류',
              '<h3>3. 사진 설정</h3>': '<h3>3. 사진 고르기</h3>',
              '메인 사진과 배경 이미지는 발행 후 교체 시 재결제가 필요합니다. 업로드 전 최종 이미지를 먼저 골라 두는 편이 안전합니다.': '공개한 뒤 대표 사진이나 배경을 바꾸면 추가 비용이 생길 수 있어요. 가장 마음에 드는 사진을 천천히 골라주세요.',
              '메인 사진 업로드': '대표 사진',
              '배경 사진 업로드': '배경 사진',
              '갤러리 사진 업로드': '함께 보여줄 사진',
              '메인 사진 선택': '대표 사진 고르기',
              '배경 사진 선택': '배경 사진 고르기',
              '갤러리 사진 선택': '사진 여러 장 고르기',
              '선택된 파일 없음': '아직 고른 사진이 없어요',
              '현재 메인 사진이 연결되어 있습니다.': '현재 대표 사진이 선택되어 있어요.',
              '현재 배경 사진이 연결되어 있습니다.': '현재 배경 사진이 선택되어 있어요.',
              '장 연결됨': '장 선택됨',
              '갤러리 비우기': '갤러리 모두 지우기',
              '이미지는 저장 시 Storage로 업로드되고, payload에는 URL만 기록됩니다.': '선택한 사진은 초대장을 저장할 때 함께 보관됩니다.',
              '데모 모드에서는 이미지가 현재 세션 미리보기로만 반영됩니다.': '로그인하지 않은 상태에서는 선택한 사진을 이 기기에서만 미리 볼 수 있어요.',
              '데모 모드에서 미리보기용 발행 상태로 저장했습니다.': '이 기기에 미리보기용 초대장을 저장했어요.',
              '데모 모드로 초안을 저장했습니다.': '작성 중인 내용을 이 기기에 저장했어요.',
              '초대장을 발행했습니다.': '초대장을 공개했어요.',
              '초안을 저장했습니다.': '작성 중인 내용을 저장했어요.',
              '초안 저장에 실패했습니다.': '작성 중인 내용을 저장하지 못했어요.',
              '초안 저장': '작성 내용 저장',
              '실제 화면 보기': '완성 모습 확인하기',
              '공개 상태 다시 저장': '수정한 내용 반영하기',
              '무료 발행 페이지로 이동': '초대장 공개하기',
              '마지막 단계에서 완성 모습 확인하기와 무료 발행을 진행할 수 있습니다.': '마지막 단계에서 완성된 모습을 확인하고 초대장을 공개할 수 있어요.',
              '완성 모습 확인하기에서 전체 초대장 레이아웃을 확인할 수 있습니다.': '받는 사람이 보게 될 화면을 완성 모습에서 천천히 살펴보세요.'
          }

          missing = [old for old in replacements if old not in content]
          if missing:
              raise SystemExit(f"Expected copy not found: {missing}")

          for old, new in replacements.items():
              content = content.replace(old, new)

          path.write_text(content, encoding="utf-8")
          PY

      - name: Commit polished copy and remove one-time workflow
        run: |
          rm .github/workflows/polish-builder-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/builder/builder-studio.tsx .github/workflows/polish-builder-copy.yml
          git commit -m "copy(builder): remove technical language from customer UI"
          git push origin HEAD:feat/osamosam-ui-v2
